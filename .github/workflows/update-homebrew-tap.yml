name: Update Homebrew Tap

on:
  release:
    types: [published]

jobs:
  update-tap:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
      
      - name: Extract version from tag
        id: version
        run: |
          # Remove 'v' prefix from tag
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Updating tap for version: $VERSION"
      
      - name: Download checksums from release
        run: |
          # Download checksum file from the release
          curl -sL "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/checksums.txt" -o checksums.txt
          
          echo "Checksums:"
          cat checksums.txt
      
      - name: Extract SHA256 checksum
        id: checksums
        run: |
          UNIVERSAL_SHA=$(grep "kube-ingress-launcher.*universal.*\.dmg" checksums.txt | awk '{print $1}')
          
          echo "universal_sha=$UNIVERSAL_SHA" >> $GITHUB_OUTPUT
          
          echo "Universal SHA256: $UNIVERSAL_SHA"
          
          if [ -z "$UNIVERSAL_SHA" ]; then
            echo "Error: Failed to extract checksum"
            exit 1
          fi
      
      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: wasilak/homebrew-kube-ingress-launcher
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
      
      - name: Update Cask formula
        run: |
          cd tap
          
          # Update version
          sed -i "s/version \".*\"/version \"${{ steps.version.outputs.version }}\"/" Casks/kube-ingress-launcher.rb
          
          # Update checksum
          sed -i "s/sha256 \".*\"/sha256 \"${{ steps.checksums.outputs.universal_sha }}\"/" Casks/kube-ingress-launcher.rb
          
          echo "Updated Cask formula:"
          cat Casks/kube-ingress-launcher.rb
      
      - name: Commit and push changes
        run: |
          cd tap
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Casks/kube-ingress-launcher.rb
          git commit -m "chore: update to version ${{ steps.version.outputs.version }}

          - Update version to ${{ steps.version.outputs.version }}
          - Update Universal SHA256: ${{ steps.checksums.outputs.universal_sha }}
          
          Automated update from release: ${{ github.event.release.html_url }}"
          
          git push origin main
      
      - name: Summary
        run: |
          echo "✅ Homebrew tap updated successfully!"
          echo ""
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Universal SHA256: ${{ steps.checksums.outputs.universal_sha }}"
          echo ""
          echo "Users can now update with:"
          echo "  brew update"
          echo "  brew upgrade --cask kube-ingress-launcher"
