name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Job 1: Run tests and checks first
  test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run frontend tests
        run: npm test
      
      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      
      - name: Check frontend build
        run: npm run build
      
      - name: Check backend build
        run: cargo build --manifest-path src-tauri/Cargo.toml
      
      - name: Lint (Clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # Job 2: Build and create release (only if tests pass)
  build-and-release:
    needs: test
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      universal_sha: ${{ steps.checksum.outputs.universal_sha }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Extract version
        id: version
        run: |
          VERSION=$(./scripts/get-version.sh)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Build Tauri app (Universal Binary)
        run: |
          npm run tauri build -- --target universal-apple-darwin
      
      - name: Locate app bundle
        id: locate
        run: |
          APP_BUNDLE=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app" -type d | head -n 1)
          echo "app_bundle=$APP_BUNDLE" >> $GITHUB_OUTPUT
          echo "Found app bundle: $APP_BUNDLE"
          
          if [ ! -d "$APP_BUNDLE" ]; then
            echo "Error: App bundle not found"
            exit 1
          fi
          
          # Verify it's a universal binary
          echo "Verifying universal binary..."
          lipo -info "$APP_BUNDLE/Contents/MacOS/"* || true
      
      - name: Create DMG
        run: |
          ./scripts/create-dmg.sh "${{ steps.locate.outputs.app_bundle }}" "${{ steps.version.outputs.version }}" "universal-apple-darwin"
      
      - name: Verify DMG created
        run: |
          DMG_FILE="kube-ingress-launcher-${{ steps.version.outputs.version }}-universal-apple-darwin.dmg"
          if [ ! -f "$DMG_FILE" ]; then
            echo "Error: DMG file not created: $DMG_FILE"
            exit 1
          fi
          echo "DMG created successfully: $DMG_FILE"
          ls -lh "$DMG_FILE"
      
      - name: Calculate checksums
        id: checksum
        run: |
          shasum -a 256 *.dmg > checksums.txt
          cat checksums.txt
          
          # Extract checksum for tap update
          UNIVERSAL_SHA=$(grep "kube-ingress-launcher.*universal.*\.dmg" checksums.txt | awk '{print $1}')
          echo "universal_sha=$UNIVERSAL_SHA" >> $GITHUB_OUTPUT
          echo "Universal SHA256: $UNIVERSAL_SHA"
      
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.dmg
            checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Update Homebrew tap (only if build succeeds)
  update-homebrew-tap:
    needs: build-and-release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: wasilak/homebrew-kube-ingress-launcher
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
      
      - name: Update Cask formula
        run: |
          VERSION="${{ needs.build-and-release.outputs.version }}"
          SHA256="${{ needs.build-and-release.outputs.universal_sha }}"
          
          # Update version and sha256 in one go
          sed -i "s/version \".*\"/version \"$VERSION\"/" Casks/kube-ingress-launcher.rb
          sed -i "s/sha256 \".*\"/sha256 \"$SHA256\"/" Casks/kube-ingress-launcher.rb
          
          echo "✅ Updated Cask formula to version $VERSION"
          echo ""
          cat Casks/kube-ingress-launcher.rb
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Casks/kube-ingress-launcher.rb
          git commit -m "chore: update to version ${{ needs.build-and-release.outputs.version }}

          - Update version to ${{ needs.build-and-release.outputs.version }}
          - Update SHA256: ${{ needs.build-and-release.outputs.universal_sha }}
          
          Automated update from: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.build-and-release.outputs.version }}"
          
          git push origin main
          
          echo "✅ Pushed changes to tap repository"
