name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Job 1: Run tests and checks first
  test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run frontend tests
        run: npm test
      
      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      
      - name: Check frontend build
        run: npm run build
      
      - name: Check backend build
        run: cargo build --manifest-path src-tauri/Cargo.toml
      
      - name: Lint (Clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # Job 2: Build and create release (only if tests pass)
  build-and-release:
    needs: test
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      universal_sha: ${{ steps.checksum.outputs.universal_sha }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for git-cliff to access full git history
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Extract version
        id: version
        run: |
          VERSION=$(./scripts/get-version.sh)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Build Tauri app (Universal Binary)
        run: |
          npm run tauri build -- --target universal-apple-darwin
      
      - name: Import self-signed certificate
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          echo "Creating temporary keychain..."
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import certificate and private key separately (PEM files)
          if [ -n "$APPLE_KEY_PEM_BASE64" ] && [ -n "$APPLE_CERT_PEM_BASE64" ]; then
            echo "Importing certificate and key..."
            echo "$APPLE_KEY_PEM_BASE64" | base64 --decode > key.pem
            echo "$APPLE_CERT_PEM_BASE64" | base64 --decode > cert.pem
            
            # Import the private key first
            security import key.pem -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
            # Import the certificate
            security import cert.pem -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
            # Set partition list to allow codesign to access the key
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            
            # Add to search list
            security list-keychain -d user -s "$KEYCHAIN_PATH"
            
            # Verify certificate is available
            echo "Available signing identities:"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            
            # Clean up PEM files
            rm key.pem cert.pem
            
            echo "✅ Certificate imported successfully"
          else
            echo "No self-signed certificate secrets found, skipping import"
          fi
        env:
          APPLE_CERT_PEM_BASE64: ${{ secrets.APPLE_CERT_PEM_BASE64 }}
          APPLE_KEY_PEM_BASE64: ${{ secrets.APPLE_KEY_PEM_BASE64 }}
      
      - name: Sign app bundle
        run: |
          APP_BUNDLE=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app" -type d | head -n 1)
          echo "🔐 Signing app bundle: $APP_BUNDLE"
          
          # Check if self-signed certificate is available (PEM files)
          if [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_CERT_PEM_BASE64" ]; then
            echo "Using self-signed certificate: $APPLE_SIGNING_IDENTITY"
            codesign -s "$APPLE_SIGNING_IDENTITY" -f --deep --timestamp --options runtime "$APP_BUNDLE"
            echo "✅ Signed with self-signed certificate"
          # Check if Apple Developer certificate is available (legacy p12 format)
          elif [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "Using Apple Developer certificate: $APPLE_SIGNING_IDENTITY"
            codesign -s "$APPLE_SIGNING_IDENTITY" -f --deep --timestamp --options runtime "$APP_BUNDLE"
            echo "✅ Signed with Apple Developer certificate"
          else
            echo "No certificate configured, using ad-hoc signing"
            echo "⚠️  Ad-hoc signing means accessibility permission will reset on each update"
            echo "To fix: Add these GitHub secrets for self-signed certificate:"
            echo "  - APPLE_CERT_PEM_BASE64 (base64-encoded cert.pem file)"
            echo "  - APPLE_KEY_PEM_BASE64 (base64-encoded key.pem file)"
            echo "  - APPLE_SIGNING_IDENTITY (e.g., 'Kube Ingress Launcher')"
            codesign -s - -f --deep "$APP_BUNDLE"
            echo "✅ Signed with ad-hoc signature"
          fi
          
          # Verify signature
          echo ""
          echo "Signature details:"
          codesign -dv --verbose=4 "$APP_BUNDLE" 2>&1 || true
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERT_PEM_BASE64: ${{ secrets.APPLE_CERT_PEM_BASE64 }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      
      - name: Cleanup keychain
        if: ${{ always() }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
      
      - name: Locate app bundle
        id: locate
        run: |
          APP_BUNDLE=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app" -type d | head -n 1)
          echo "app_bundle=$APP_BUNDLE" >> $GITHUB_OUTPUT
          echo "Found app bundle: $APP_BUNDLE"
          
          if [ ! -d "$APP_BUNDLE" ]; then
            echo "Error: App bundle not found"
            exit 1
          fi
          
          # Verify it's a universal binary
          echo "Verifying universal binary..."
          lipo -info "$APP_BUNDLE/Contents/MacOS/"* || true
      
      - name: Create DMG
        run: |
          ./scripts/create-dmg.sh "${{ steps.locate.outputs.app_bundle }}" "${{ steps.version.outputs.version }}" "universal-apple-darwin"
      
      - name: Verify DMG created
        run: |
          DMG_FILE="kube-ingress-launcher-${{ steps.version.outputs.version }}-universal-apple-darwin.dmg"
          if [ ! -f "$DMG_FILE" ]; then
            echo "Error: DMG file not created: $DMG_FILE"
            exit 1
          fi
          echo "DMG created successfully: $DMG_FILE"
          ls -lh "$DMG_FILE"
      
      - name: Calculate checksums
        id: checksum
        run: |
          shasum -a 256 *.dmg > checksums.txt
          cat checksums.txt
          
          # Extract checksum for tap update
          UNIVERSAL_SHA=$(grep "kube-ingress-launcher.*universal.*\.dmg" checksums.txt | awk '{print $1}')
          echo "universal_sha=$UNIVERSAL_SHA" >> $GITHUB_OUTPUT
          echo "Universal SHA256: $UNIVERSAL_SHA"
      
      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose --latest --strip all
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
      
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.dmg
            checksums.txt
          draft: false
          prerelease: false
          body: ${{ steps.git-cliff.outputs.content }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Update Homebrew tap (only if build succeeds)
  update-homebrew-tap:
    needs: build-and-release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v6
        with:
          repository: wasilak/homebrew-kube-ingress-launcher
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
      
      - name: Update Cask formula
        run: |
          VERSION="${{ needs.build-and-release.outputs.version }}"
          SHA256="${{ needs.build-and-release.outputs.universal_sha }}"
          
          # Update version and sha256 in one go
          sed -i "s/version \".*\"/version \"$VERSION\"/" Casks/kube-ingress-launcher.rb
          sed -i "s/sha256 \".*\"/sha256 \"$SHA256\"/" Casks/kube-ingress-launcher.rb
          
          echo "✅ Updated Cask formula to version $VERSION"
          echo ""
          cat Casks/kube-ingress-launcher.rb
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Casks/kube-ingress-launcher.rb
          git commit -m "chore: update to version ${{ needs.build-and-release.outputs.version }}

          - Update version to ${{ needs.build-and-release.outputs.version }}
          - Update SHA256: ${{ needs.build-and-release.outputs.universal_sha }}
          
          Automated update from: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.build-and-release.outputs.version }}"
          
          git push origin main
          
          echo "✅ Pushed changes to tap repository"
